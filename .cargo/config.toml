[build]
# Existing default: CPU-native features for ALL profiles, including tests.
# CPU-native binaries are NOT portable between different host CPUs.
# For the canonical portable comparison, override this setting using
# RUSTFLAGS='' cargo test --all-targets --locked
# (verified: an explicitly empty RUSTFLAGS omits -C target-cpu=native).
rustflags = ["-C", "target-cpu=native"]
